name = "ctrl-push-relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_BUNDLE_IDS = "com.nachogames.ctrl,com.nachogames.ctrl.dev,com.nachogames.ctrl.preview"

[[kv_namespaces]]
binding = "DEVICES"
id = "REPLACE_IN_TASK_6"

[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "SEND_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
