# Ctrl's review loop: what it files as review sources.

# One read for the review loop: reviews with the commit each reviewed, the reviewers still asked,
# and thread comments with the review that wrote them, so each review's own comments can be shown
# as it wrote them. Reviews and threads are the newest 100 (`last`, still oldest first within the
# page): every thread reply Ctrl posts is itself a review, so a long-running pull request passes
# 100 reviews, and a `first` page would never see a new one.
query ReviewRound($owner: String!, $name: String!, $number: Int!) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      headRefOid
      author {
        __typename
        login
        avatarUrl
      }
      reviews(last: 100) {
        nodes {
          id
          body
          state
          submittedAt
          url
          commit {
            oid
          }
          author {
            __typename
            login
            avatarUrl
          }
        }
      }
      reviewRequests(first: 50) {
        nodes {
          requestedReviewer {
            ... on User {
              login
              name
              avatarUrl
            }
            ... on Bot {
              login
              avatarUrl
            }
          }
        }
      }
      reviewThreads(last: 100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          comments(first: 20) {
            nodes {
              id
              body
              url
              diffHunk
              pullRequestReview {
                id
              }
              author {
                __typename
                login
                avatarUrl
              }
            }
          }
        }
      }
    }
  }
}
