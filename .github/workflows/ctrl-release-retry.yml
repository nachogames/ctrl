name: Ctrl release retry

# GitHub's hosted macOS runners sometimes run out, and a job that no runner
# picks up within about 15 minutes fails without running a single step. This
# re-runs the failed jobs of a release that failed only that way. A job that
# started and then failed (build, signing, notarization) is left failed.

on:
  workflow_run:
    workflows: ["Ctrl release", "Ctrl Android release"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Re-run jobs no runner picked up
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run if every failed job never started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '.jobs')"
          failed="$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")]' <<<"$jobs")"
          started="$(jq '[.[] | select(.steps | length > 0)] | length' <<<"$failed")"
          if [[ "$(jq length <<<"$failed")" == 0 || "$started" != 0 ]]; then
            echo "A job ran and failed; not retrying." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "No runner picked up attempt $ATTEMPT; re-running its failed jobs." >> "$GITHUB_STEP_SUMMARY"
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
