name: Ctrl release

# Builds the signed, notarized Apple Silicon desktop app and publishes it as a
# GitHub release. Installed apps poll this repository's latest release
# (latest-mac.yml) and update themselves.
#
# The android job then publishes the phone app: an OTA update on the Expo
# project's production channel, plus a signed APK attached to the release
# whenever native code changed. Phones take the OTA only when their APK has the
# same native fingerprint, so a release whose APK is new needs one install.
#
# Release: git tag ctrl-v0.1.1 && git push origin ctrl-v0.1.1
# The tag's version must be higher than every earlier release.
#
# Phone only: git tag ctrl-android-v0.1.2 && git push origin ctrl-android-v0.1.2
# runs just the android job. It creates a GitHub release only when it builds an
# APK, and that release is a prerelease so the desktop updater, which reads the
# latest release, never lands on it.
#
# Signing secrets live in the `release` environment, which only accepts
# ctrl-v* and ctrl-android-v* tags. Pull requests and branch pushes never see them.

on:
  push:
    tags:
      - "ctrl-v*"
      - "ctrl-android-v*"

concurrency:
  group: ctrl-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS arm64
    if: startsWith(github.ref_name, 'ctrl-v')
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    steps:
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#ctrl-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME must look like ctrl-v1.2.3." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Plain git instead of actions/checkout: checkout's credential cleanup
      # trips over the orphaned gitlinks in the vendored .repos tree.
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build signed desktop artifact
        env:
          CSC_LINK: ${{ secrets.CTRL_MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CTRL_MAC_CERT_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.CTRL_ASC_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.CTRL_ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.CTRL_ASC_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name. Unsigned builds cannot auto-update, so nothing is published." >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          export APPLE_API_KEY="$key_path"
          unset APPLE_API_KEY_CONTENT

          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --signed \
            --verbose

          rm -f "$key_path"

      - name: Verify notarized signature
        run: |
          set -euo pipefail
          zip=$(ls release/*.zip | head -1)
          check_dir="$RUNNER_TEMP/verify"
          mkdir -p "$check_dir"
          ditto -x -k "$zip" "$check_dir"
          app=$(ls -d "$check_dir"/*.app | head -1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          test -f release/latest-mac.yml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ctrl ${{ steps.version.outputs.version }}" \
            --generate-notes \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml

  android:
    name: Publish Android OTA and APK
    needs: release
    # A ctrl-android-v* tag skips the desktop job; a ctrl-v* tag waits for it,
    # since the APK attaches to the release that job creates.
    if: ${{ !cancelled() && (needs.release.result == 'success' || (needs.release.result == 'skipped' && startsWith(github.ref_name, 'ctrl-android-v'))) }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      EAS_CLI: eas-cli@24.12.1
    steps:
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#ctrl-android-v}"
          version="${version#ctrl-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME must look like ctrl-v1.2.3 or ctrl-android-v1.2.3." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same plain checkout as the desktop job.
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install mobile dependencies
        run: vp install --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Write signing and Firebase files
        env:
          KEYSTORE_BASE64: ${{ secrets.CTRL_ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.CTRL_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 GOOGLE_SERVICES_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name; nothing is published." >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ctrl-release.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "T3CODE_ANDROID_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      # The fingerprint is the runtime version under the fingerprint policy: an
      # OTA reaches an APK only when the two match. It is computed here, on the
      # same machine that builds the APK and publishes the update.
      - name: Fingerprint native code
        id: fingerprint
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hash="$(npx expo-updates fingerprint:generate --platform android | sed -n '/^{/,$p' | jq -er '.hash')"
          short="${hash:0:12}"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "apk=Ctrl-${{ steps.version.outputs.version }}-android-$short.apk" >> "$GITHUB_OUTPUT"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | .tag_name as $tag | .assets[] | select(.name | endswith("-android-'"$short"'.apk")) | "\($tag) \(.name)"' | head -1)"
          if [[ -n "$existing" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "existing=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK
        if: steps.fingerprint.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CTRL_ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_RUNTIME: ${{ steps.fingerprint.outputs.hash }}
          APK_NAME: ${{ steps.fingerprint.outputs.apk }}
        run: |
          set -euo pipefail
          EXPO_NO_GIT_STATUS=1 npx expo prebuild --clean --platform android
          cd android
          # arm64 only: every phone Ctrl targets, and a quarter of the native compile.
          ./gradlew :app:assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ctrl-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=ctrl \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          apk=app/build/outputs/apk/release/app-release.apk
          # The APK must carry the runtime version the OTA will be published under.
          # Under the fingerprint policy the APK reads it from assets/fingerprint.
          embedded="$(unzip -p "$apk" assets/fingerprint)"
          if [[ "$embedded" != "$EXPECTED_RUNTIME" ]]; then
            echo "APK runtime version '$embedded' does not match fingerprint '$EXPECTED_RUNTIME'." >&2
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | grep -q 'CN=Ctrl'
          mv "$apk" "$RUNNER_TEMP/$APK_NAME"

      # A phone-only tag has no desktop release to attach to. Its release holds
      # just the APK and is a prerelease, never "latest", so desktop apps keep
      # updating from the newest ctrl-v* release.
      - name: Create Android-only release
        if: steps.fingerprint.outputs.build == 'true' && startsWith(github.ref_name, 'ctrl-android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ctrl Android ${{ steps.version.outputs.version }}" \
            --notes "Android app only. Install the APK once; later phone releases arrive over the air." \
            --prerelease \
            --latest=false

      - name: Attach APK to the release
        if: steps.fingerprint.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/${{ steps.fingerprint.outputs.apk }}" --repo "$GITHUB_REPOSITORY"

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPECTED_RUNTIME: ${{ steps.fingerprint.outputs.hash }}
        run: |
          set -euo pipefail
          result="$(npx -y "$EAS_CLI" update \
            --channel production \
            --environment production \
            --platform android \
            --message "Ctrl ${{ steps.version.outputs.version }}" \
            --non-interactive --json | sed -n '/^\[/,$p')"
          runtime="$(jq -er '.[0].runtimeVersion' <<<"$result")"
          if [[ "$runtime" != "$EXPECTED_RUNTIME" ]]; then
            echo "OTA runtime version '$runtime' does not match fingerprint '$EXPECTED_RUNTIME'; no APK can take it." >&2
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Android"
            if [[ "${{ steps.fingerprint.outputs.build }}" == "true" ]]; then
              echo "Native code changed: install **${{ steps.fingerprint.outputs.apk }}** from this release once. Later JS-only releases arrive over the air."
            else
              echo "Native code unchanged (APK from ${{ steps.fingerprint.outputs.existing }}). Phones get this release over the air."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
