<html>
  <head>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        font-family: -apple-system, "SF Pro Display", Inter, system-ui;
        color: #ddd;
        padding: 28px;
        display: flex;
        gap: 44px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .icon {
        width: 256px;
        height: 256px;
        border-radius: 56px;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: flex-end;
      }
      .small {
        background: #000;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h3 {
        margin: 0;
        font-weight: 600;
        font-size: 17px;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #999;
        width: 260px;
        text-align: center;
      }
      .light {
        background: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <!-- A: outline keycap, lowercase ctrl bottom-left (classic keyboard legend) -->
    <div class="col">
      <div class="icon" id="a"></div>
      <div class="row">
        <div class="small" style="width: 64px; height: 64px" id="a64"></div>
        <div class="small" style="width: 32px; height: 32px" id="a32"></div>
        <div class="small" style="width: 16px; height: 16px; border-radius: 4px" id="a16"></div>
      </div>
      <h3>A · Outline keycap</h3>
      <p>Line-drawn key with its top face inset, "ctrl" in the lower-left like a real legend</p>
    </div>
    <!-- B: solid white keycap, black text centered -->
    <div class="col">
      <div class="icon" id="b"></div>
      <div class="row">
        <div class="small" style="width: 64px; height: 64px" id="b64"></div>
        <div class="small" style="width: 32px; height: 32px" id="b32"></div>
        <div class="small" style="width: 16px; height: 16px; border-radius: 4px" id="b16"></div>
      </div>
      <h3>B · Solid keycap</h3>
      <p>A bright physical key seen slightly from above, "ctrl" centered on the top face</p>
    </div>
    <!-- C: Mac style with ^ glyph -->
    <div class="col">
      <div class="icon" id="c"></div>
      <div class="row">
        <div class="small" style="width: 64px; height: 64px" id="c64"></div>
        <div class="small" style="width: 32px; height: 32px" id="c32"></div>
        <div class="small" style="width: 16px; height: 16px; border-radius: 4px" id="c16"></div>
      </div>
      <h3>C · Mac control key</h3>
      <p>Apple-keyboard style: "⌃" top-right, "control" bottom-left</p>
    </div>
    <script>
      const A = `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="22" width="92" height="88" rx="16" fill="none" stroke="white" stroke-width="5"/><rect x="28" y="28" width="72" height="66" rx="10" fill="none" stroke="white" stroke-width="3" opacity=".55"/><text x="35" y="86" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-weight="600" font-size="21" fill="white">ctrl</text></svg>`;
      const B = `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="20" width="96" height="92" rx="18" fill="#8a8a8a"/><rect x="16" y="16" width="96" height="86" rx="18" fill="white"/><rect x="24" y="22" width="80" height="70" rx="12" fill="#ececec"/><text x="64" y="66" text-anchor="middle" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-weight="700" font-size="25" fill="#111">ctrl</text></svg>`;
      const C = `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="20" width="92" height="90" rx="16" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="2"/><rect x="18" y="18" width="92" height="84" rx="16" fill="#2c2c2e"/><text x="98" y="44" text-anchor="end" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-weight="500" font-size="24" fill="white">⌃</text><text x="30" y="90" font-family="-apple-system,SF Pro Display,Inter,sans-serif" font-weight="500" font-size="15" fill="white">control</text></svg>`;
      for (const [id, svg] of [
        ["a", A],
        ["b", B],
        ["c", C],
      ])
        for (const suf of ["", "64", "32", "16"]) {
          const el = document.getElementById(id + suf);
          el.innerHTML = svg;
          el.firstChild.style.width = suf ? "82%" : "78%";
          el.firstChild.style.height = suf ? "82%" : "78%";
        }
    </script>
  </body>
</html>
